# @package _global_

defaults:
  - trainer: GradAscent
  - data: unlearn
  - collator: DataCollatorForSupervisedDataset
  - eval: null
  - codecarbon: default
  - hub_adapter: default
  - hydra: default
  - paths: default
  - override /data/datasets@data.forget: CustomHF_forget
  - override /data/datasets@data.retain: CustomHF_retain
  - _self_

model:
  model_args:
    pretrained_model_name_or_path: "Qwen/Qwen2.5-Coder-3B"
    peft_name: "dbaysal/qwen2.5coder-3b-learned"
    peft_checkpoint_subfolder: "checkpoint-282"
  tokenizer_args:
    pretrained_model_name_or_path: "Qwen/Qwen2.5-Coder-3B"
  template_args:
    apply_chat_template: false
    user_start_tag: ""
    user_end_tag: ""
    asst_start_tag: ""
    asst_end_tag: ""

data:
  batch_mode: mixed
  batch_order: random
  anchor: forget
  
  forget:
    CustomHF_forget:
      handler: CompletionDataset
      args:
        hf_args:
          path: ${forget_dataset_path}
          split: ${forget_split}
        prefix_key: ${prefix_key}
        text_key: ${text_key}
        max_length: ${max_length}
  retain:
    CustomHF_retain:
      handler: CompletionDataset
      args:
        hf_args:
          path: ${retain_dataset_path}
          split: ${retain_split}
        prefix_key: ${prefix_key}
        text_key: ${text_key}
        max_length: ${max_length}

trainer:
  args:
    per_device_train_batch_size: 8
    gradient_accumulation_steps: 4
    learning_rate: 1e-5
    num_train_epochs: 10
    lr_scheduler_type: constant
    bf16: true
    fp16: false
    bf16_full_eval: false
    optim: adamw_torch
    remove_unused_columns: false
    seed: 42
    do_eval: false
    eval_strategy: "no"
    eval_on_start: false
    save_strategy: epoch
    save_only_model: true
    save_total_limit: null

forget_dataset_path: "dbaysal/forget"
forget_split: "train"
retain_dataset_path: ${forget_dataset_path}
retain_split: ${forget_split}
prefix_key: "check"
text_key: "code"
max_length: 2056

mode: unlearn
task_name: custom_hf_mixed_ga
