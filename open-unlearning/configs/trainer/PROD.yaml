defaults:
  - GradDiff

handler: PROD
args:
  learning_rate: 5e-6
  num_train_epochs: 10
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 32
  logging_steps: 1
  save_total_limit: 2
  save_strategy: "no"
  overwrite_output_dir: true
  optim: adamw_torch
method_args:
  top_p: 0.8
  temperature: null
  N: 1
  max_N: null
  prod_alpha: 0.0
  gamma: 1.0
  alpha: 0.0
  retain_loss_type: NLL
