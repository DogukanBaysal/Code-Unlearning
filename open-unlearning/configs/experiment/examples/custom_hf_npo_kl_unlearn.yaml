# @package _global_

defaults:
  - override /model: Llama-2-7b-hf
  - override /trainer: NPO
  - override /data: unlearn
  - override /data/datasets@data.forget: CustomHF_forget
  - override /data/datasets@data.retain: CustomHF_retain
  - override /eval: null

model:
  model_args:
    pretrained_model_name_or_path: "your-model-or-checkpoint"
    peft_name: "your-peft-model-or-checkpoint"
    # Optional: load the PEFT adapter from a subfolder under peft_name.
    # peft_checkpoint_subfolder: "checkpoint-1875"

data:
  anchor: forget
  forget:
    CustomHF_forget:
      args:
        hf_args:
          path: ${forget_dataset_path}
          split: ${forget_split}
        text_key: ${text_key}
        max_length: ${max_length}
  retain:
    CustomHF_retain:
      args:
        hf_args:
          path: ${retain_dataset_path}
          split: ${retain_split}
        text_key: ${text_key}
        max_length: ${max_length}

trainer:
  args:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8
    learning_rate: 1e-5
    num_train_epochs: 5
    lr_scheduler_type: constant
    bf16: true
    remove_unused_columns: false
  method_args:
    beta: 0.1
    gamma: 1.0
    alpha: 1.0
    retain_loss_type: KL

forget_dataset_path: "your-org/your-forget-dataset"
forget_split: "train"
retain_dataset_path: "your-org/your-retain-dataset"
retain_split: "train"
text_key: "text"
max_length: 2048

task_name: custom_hf_npo_kl_unlearn
