# @package _global_

defaults:
  - method: ga
  - model: qwen2_5_coder_3b
  - _self_

unlearning_task: secret

forget_dataset_path: "dbaysal/forget"
forget_split: "train"
retain_dataset_path: "dbaysal/retain-half"
retain_split: ${forget_split}
prefix_key: "check"
text_key: "secret_value"
forget_text_key: "secret_value"
retain_text_key: "code"
max_length: 2056

data:
  forget:
    CustomHF_forget:
      args:
        hf_args:
          path: ${forget_dataset_path}
          split: ${forget_split}
        prefix_key: ${prefix_key}
        text_key: ${forget_text_key}
        max_length: ${max_length}
  retain:
    CustomHF_retain:
      args:
        hf_args:
          path: ${retain_dataset_path}
          split: ${retain_split}
        prefix_key: ${prefix_key}
        text_key: ${retain_text_key}
        max_length: ${max_length}

task_name: custom_hf_${unlearning_task}_${model_name}_${method_name}
